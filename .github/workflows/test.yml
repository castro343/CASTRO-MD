name: CASTRO-MD tests

on:
  push:
    branches:
      - main
      - fix/multi-tenant-pairing-handshake
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
