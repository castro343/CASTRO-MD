services:
  - type: web
    name: castro-md
    runtime: docker
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        value: "254739082713"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: castro_md
      - key: AUTO_VIEW_STATUS
        value: "true"
      - key: BOT_NAME
        value: CASTRO-MD
      - key: PREFIX
        value: "."
      - key: MODE
        value: public
      - key: TIMEZONE
        value: Africa/Nairobi
      - key: CONNECT_ALERT
        value: "true"
      - key: AUTO_READ
        value: "false"
      - key: ANTI_CALL
        value: "false"
      - key: ALWAYS_ONLINE
        value: "false"
